name: containers
on:
  workflow_call:
    inputs:
      fedora_branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      fedora_branch:
        type: choice
        description: 'fedora branch'
        required: true
        options:
          - '42'
          - '43'
          - 'rawhide'
        default: '42'
  push:
    paths:
      - 'desktops/**'

run-name: "containers: fedora ${{ inputs.fedora_branch || 42 }} ${{ github.event_name == 'push' && format(' | {0}', github.event.head_commit.message) || '' }}"

jobs:
  desktops:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        device: [xiaomi-nabu, xiaomi-pipa, oneplus-sdm845, nothing-spacewar]
        desktop: [niri, sway, hyprland, cosmic]
    steps:
      - name: Checkout pocketblue repo
        uses: actions/checkout@v4
        with:
          repository: pocketblue/pocketblue

      - name: Checkout extra repo
        uses: actions/checkout@v4
        with:
          path: extra

      - name: Merge desktops
        run: cp -arT extra/desktops desktops

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Build
        id: build
        run: |
          just \
            branch=${{ inputs.fedora_branch || 42 }} \
            device=${{ matrix.device }} \
            desktop=${{ matrix.desktop }} \
            registry=${{ vars.REGISTRY }} \
            rechunk_suffix=-build \
            build

      - name: Rechunk
        id: rechunk
        run: |
          just \
            branch=${{ inputs.fedora_branch || 42 }} \
            device=${{ matrix.device }} \
            desktop=${{ matrix.desktop }} \
            registry=${{ vars.REGISTRY }} \
            rechunk_suffix=-build \
            rechunk

      - name: Push
        id: push
        uses: pocketblue/actions/container-push@main
        env:
          username: ${{ vars.REGISTRY_USERNAME != '' && vars.REGISTRY_USERNAME || github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN != '' && secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          registry: ${{ vars.REGISTRY }}
          name: ${{ matrix.device }}-${{ matrix.desktop }}
          tag: ${{ inputs.fedora_branch || 42 }}
